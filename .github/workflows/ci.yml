name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and test dependencies without a model-serving engine
        run: python -m pip install -r requirements-app.txt "pytest>=9,<10" "ruff>=0.12,<1" "xlwt==1.3.0" "jsonschema>=4.20,<5"
      - name: Lint for correctness errors
        run: python -m ruff check .
      - name: Run complete Python regression suite
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            requirements: requirements-app.txt
          - os: windows-latest
            requirements: requirements-windows.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-windows.txt
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install application dependencies without a model-serving engine
        run: python -m pip install -r ${{ matrix.requirements }} "pytest>=9,<10" "ruff>=0.12,<1" "xlwt==1.3.0" "jsonschema>=4.20,<5"
      - name: Lint for correctness errors
        run: python -m ruff check .
      - name: Run Windows/Linux platform regressions
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -X utf8 scripts/run_platform_regression.py --output-dir outputs/ci-platform
      - name: Preserve platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}-python312
          path: outputs/ci-platform/
