[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".venv",
  ".venv-*",
  "vendor_packages",
  ".codex-backups",
  "data",
  "outputs",
  "work",
]

[tool.ruff.lint]
# Keep the first CI gate focused on correctness. Formatting can be adopted
# module-by-module without a repository-wide noisy rewrite.
select = ["E9", "F63", "F7", "F82"]
